fail-on-severity: moderate
comment-summary-in-pr: on-failure
deny-licenses:
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later
# New packages with a weak OpenSSF Scorecard (no repo, no maintainers, no history) get flagged in the PR summary.
show-openssf-scorecard: true
warn-on-openssf-scorecard-level: 3
