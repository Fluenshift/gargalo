version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A version waits seven days before Dependabot proposes it: time for the registry to pull a bad release,
    # and well past the one day pnpm requires (pnpm-workspace.yaml). Security updates don't wait.
    cooldown:
      default-days: 7
    ignore:
      # Types must match engines.node in package.json (24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
