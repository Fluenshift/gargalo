name: Quality Gate

# Every PR, also one stacked on another PR's branch; pushes only on main.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run of the push before it: only the last one matters.
# On main every merge is checked: each commit gets its own group, because a shared group keeps only one
# pending run and cancels the others even with cancel-in-progress off (three quick merges lost the middle one).
concurrency:
  group: quality-gate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    # One job: each job set up a runner and installed again, so four jobs in a row paid that four times.
    # It always reports a result, so it can be a required check. A change that only touches documentation
    # passes without installing or testing (docs/CONTRIBUTING.md).
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Whole history: the next step diffs against the base. Nothing here pushes, so the token isn't kept.
          fetch-depth: 0
          persist-credentials: false
      - name: Changes beyond documentation
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Any doubt (no base, a failed or empty diff) runs the whole gate.
          if files=$(git diff --name-only "$BASE" HEAD 2>/dev/null) && [ -n "$files" ] \
            && ! grep -qvE '(\.md$|^docs/|^\.claude/)' <<< "$files"; then
            echo "Only documentation changed: the gate passes without installing or testing."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      # The version comes from packageManager in package.json.
      - if: steps.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v6.1.1
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          # engines.node, the same version Vercel reads.
          node-version-file: package.json
          cache: pnpm
      - if: steps.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile
      # Every installed package must carry a valid npm registry signature (catches tampered tarballs).
      - if: steps.changes.outputs.code == 'true'
        run: pnpm audit signatures
      - if: steps.changes.outputs.code == 'true'
        run: pnpm run lint
      # tsc -b, then vite build: a type error fails here, before the minute of tests.
      - if: steps.changes.outputs.code == 'true'
        run: pnpm run build
      # vercel.json gives the Oficina worker its own CSP by file name; renamed, it would lose eval and WASM in production.
      - if: steps.changes.outputs.code == 'true'
        run: ls dist/assets/oficinaWorker-*.js
      # Thresholds (80%) live in vite.config.ts; vitest exits non-zero below them.
      # 100%: every vCPU of the runner. By default vitest leaves one to its main process, which mostly waits.
      - if: steps.changes.outputs.code == 'true'
        run: pnpm run test:coverage --maxWorkers=100%
