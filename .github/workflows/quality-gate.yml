name: Quality Gate

# A change that only touches documentation skips the gate (docs/CONTRIBUTING.md).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.claude/**', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', '.claude/**', 'docs/**']

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Fail-fast: each job only runs if the previous one passed.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json. Third-party action: pinned to a commit.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every installed package must carry a valid npm registry signature (catches tampered tarballs).
      - run: pnpm audit signatures
      - run: pnpm exec oxlint --deny-warnings

  typecheck:
    name: Typecheck
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json. Third-party action: pinned to a commit.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b

  test:
    name: Test and coverage
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json. Third-party action: pinned to a commit.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Thresholds (80%) live in vite.config.ts; vitest exits non-zero below them.
      - run: pnpm run test:coverage

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The version comes from packageManager in package.json. Third-party action: pinned to a commit.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
