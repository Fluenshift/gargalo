# Supply-chain settings: https://pnpm.io/supply-chain-security
# Loosen them only with the owner's approval. Already on by default in pnpm 12: dependency
# build scripts don't run unless allowed (none of ours needs one), and transitive dependencies
# can't come from git or tarball URLs.

# Install only versions published at least a day ago. Set explicitly so it is strict:
# a younger version fails the install instead of being let through.
minimumReleaseAge: 1440

# Refuse a version published with weaker evidence (trusted publisher, provenance) than the
# versions before it: the trace a stolen publish token leaves.
trustPolicy: no-downgrade
